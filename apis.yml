name: Evreka
description: Evreka is a smart waste and recycling management technology company offering an end-to-end
  "Sustainability as a Service" platform that digitizes the entire waste management lifecycle. Its software
  suite spans operations, fleet, asset, MRF, and workforce management, route optimization, citizen engagement,
  and EPR/PRO management, complemented by IoT hardware such as fill-level sensors, vehicle and container
  trackers, and RFID readers. Evreka serves dumpster rental, recycling centers, medical, hazardous and liquid
  waste, construction and demolition, local authorities, and cross-border waste operators. Backed by 500
  Global, it is tracked in the API Evangelist network; no public API or developer portal is currently published.
